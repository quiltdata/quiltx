[project]
name = "quiltx"
version = "0.23.1"
description = "Unified toolkit for Quilt workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Quiltx Contributors" }
]
keywords = ["quiltx", "tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Rust",
]
dependencies = [
  "keyring>=24.0",
  "platformdirs",
  "pyyaml",
  "quilt3>=8.1.0a3,<9",
  "rich"
]

[project.optional-dependencies]
dev = [
  "black",
  "mypy",
  "pre-commit",
  "poethepoet",
  "pytest",
  "types-PyYAML",
]
docs = [
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "mkdocs-autorefs>=0.5.0",
]

[tool.poe.tasks]
run = "uv run quiltx"

[tool.poe.tasks.sync]
help = "Install dev dependencies."
cmd = "uv sync --extra dev"

[tool.poe.tasks.test]
help = "Run unit tests."
sequence = ["sync", { cmd = "pytest tests" }]

[tool.poe.tasks.setup]
help = "Install pre-commit hooks."
sequence = ["sync", { shell = "pre-commit install && pre-commit install --hook-type pre-push" }]

[tool.poe.tasks.lint]
help = "Lint and type-check code."
sequence = ["sync", { shell = "black . && mypy quiltx tests" }]

[tool.poe.tasks.lint-check]
help = "Lint without modifying files (for CI)."
sequence = ["sync", { shell = "black --check . && mypy quiltx tests" }]

[tool.poe.tasks.bump]
help = "Bump version (default patch). Usage: ./poe bump [major|minor|patch|pre|release] [--pre a|b|rc]"
cmd = "python scripts/bump_version.py"

[tool.poe.tasks.test-all]
help = "Install hooks, lint, and run all tests (including integration if enabled)."
sequence = ["setup", "lint", { shell = "QUILTX_STACK_INTEGRATION=1 pytest tests" }]

[tool.poe.tasks.release-notes]
help = "Preview release notes for the current version"
cmd = "python scripts/release_notes.py"

[project.scripts]
quiltx = "quiltx.cli:main"

[project.urls]
Homepage = "https://github.com/quiltdata/quiltx"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "quiltx._core"
python-source = "."
# Adds pyo3/extension-module to the wheel build only (see rust/Cargo.toml).
features = ["pyo3/extension-module"]
# A local build runs after the tests have written bytecode; never ship it.
exclude = ["**/__pycache__/**", "**/*.pyc"]
# The sdist also carries what a downstream packager needs to run the tests.
include = [
  { path = "tests/**/*.py", format = "sdist" },
  { path = "scripts/*.py", format = "sdist" },
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "stack-acl.example.yaml", format = "sdist" },
]

[tool.uv]
# Rebuild the editable install when the Rust sources change.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "rust/Cargo.toml" },
  { file = "rust/Cargo.lock" },
  { file = "rust/**/*.rs" },
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true

[tool.pytest.ini_options]
markers = [
  "integration: marks tests that require live services",
]
