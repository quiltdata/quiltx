# Quilt Stack ACL: Licensed Datasets Example
#
# Scenario: 5 licensed datasets (buckets). Each user gets access to a
# specific subset based on their license agreement. SSO groups control
# which combination each user receives.
#
# Pattern: one policy per dataset, then roles compose policies.
# This avoids enumerating all 2^5 = 32 combinations up front --
# you only define the roles that actually map to SSO groups.

bucket_policies:

  # Each licensed dataset gets its own policy for granular composition
  alpha:
    read:
      - licensed-alpha

  beta:
    read:
      - licensed-beta

  charlie:
    read:
      - licensed-charlie

  delta:
    read:
      - licensed-delta

  echo:
    read:
      - licensed-echo

  # Shared public data (available to everyone)
  public:
    read:
      - shared-public

roles:

  # Base role: public data only (no licensed access)
  visitor:
    bucket_policies: [public]

  # Single-dataset roles (for users licensed to exactly one)
  licensed_alpha:
    bucket_policies: [public, alpha]

  licensed_beta:
    bucket_policies: [public, beta]

  # Multi-dataset roles (only define combos that actually exist)
  licensed_alpha_beta:
    bucket_policies: [public, alpha, beta]

  licensed_beta_echo:
    bucket_policies: [public, beta, echo]

  # Full access for internal analysts
  licensed_all:
    bucket_policies: [public, alpha, beta, charlie, delta, echo]

  # Admin/staff: full read-write would use read_write bucket_policies
  staff:
    bucket_policies: [public, alpha, beta, charlie, delta, echo]
    default: true

sso:
  # Internal staff get full access + admin
  - match:
      groups: Staff
    roles: [staff]
    admin: true

  # Map SSO groups to the specific licensed combinations
  # (groups are created when a user's license agreement is approved)
  - match:
      groups: License-Alpha
    roles: [licensed_alpha]

  - match:
      groups: License-Beta
    roles: [licensed_beta]

  - match:
      groups: License-Alpha-Beta
    roles: [licensed_alpha_beta]

  - match:
      groups: License-Beta-Echo
    roles: [licensed_beta_echo]

  - match:
      groups: License-All
    roles: [licensed_all]

  # Catch-all: authenticated users with no license get public only
  - match:
      groups: Everyone
    roles: [visitor]
