# Quilt Stack ACL: Licensed Datasets
#
# Each named policy declares:
#   - the SSO groups that confer it
#   - the permissions it grants (e.g. read access to specific buckets)
#
# A user qualifies for a policy if they belong to any of its listed groups.
# Their effective role is the union of all policies they qualify for.

policies:

  public:
    sso.groups:   [Everyone]
    buckets.read: [shared-public]

  alpha:
    sso.groups:   [License-Alpha]
    buckets.read: [licensed-alpha]

  beta:
    sso.groups:   [License-Beta]
    buckets.read: [licensed-beta]

roles:

  # Static role: composes explicit policies AND bucket grants.
  staff:
    policies:           [public, alpha, beta]
    buckets.read:       [exec-reports]
    buckets.read_write: [exec-workspace]
    config.admin: true
