[package]
name = "quiltx-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Rust core of quiltx, exposed to Python as quiltx._core"
license = "Apache-2.0"
repository = "https://github.com/quiltdata/quiltx"
publish = false

[lib]
# Imported from Python as `quiltx._core`; maturin installs it under that name.
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
# The Python extension and the modules that still call into Python. On by
# default, so the wheel build is unchanged; a Rust consumer that wants only the
# pure parts (`dns`, `paths`, which come from `quilt-auth`) sets
# `default-features = false`.
default = ["python"]
python = ["dep:pyo3", "dep:serde_json"]

[dependencies]
# abi3-py310 matches requires-python >=3.10: one wheel per platform serves every
# CPython 3.10+. `extension-module` is deliberately NOT set here: maturin adds it
# (see [tool.maturin] features in pyproject.toml), so `cargo test` can still link
# against libpython.
pyo3 = { version = "0.30", features = ["abi3-py310"], optional = true }
# Catalog-name normalization (`dns`) and credential locations (`paths`), shared
# with quilt-rs. Pinned by commit; re-pin to the commit on quilt-rs `main` that
# holds the crate. It builds without Python, so the `python` feature below leaves
# it alone.
quilt-auth = { git = "https://github.com/quiltdata/quilt-rs", rev = "15183d6dd1587dd0fe5a3a0555d2c252155e2b43" }
# Ordered JSON maps, so a rewrite keeps key order; dumps is in store.rs so it
# matches Python's json.dumps (ensure_ascii, indent=2). arbitrary_precision and
# float_roundtrip let us read out-of-range floats and large integers.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "float_roundtrip"], optional = true }

[profile.release]
# Smaller wheels: the extension ships in every platform file.
strip = true
lto = true
