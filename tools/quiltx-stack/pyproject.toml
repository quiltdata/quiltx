[project]
name = "quiltx-stack"
version = "0.1.0"
description = "A quiltx tool for printing a stack summary."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Quiltx Contributors" }
]
keywords = ["quiltx", "cli", "diagnostics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = ["quiltx"]

[project.scripts]
quiltx-stack = "quiltx_stack.cli:main"

[project.urls]
Homepage = "https://github.com/ernest/quiltx"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quiltx_stack"]
